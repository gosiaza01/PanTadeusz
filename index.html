<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Pan Tadeusz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-danger text-white text-center py-4">
        <h1>Pan Tadeusz, czyli ostatni zajazd na Litwie: historia szlachecka z roku 1811 i 1812 we dwunastu księgach wierszem.</h1>
        <h5>Adam Mickiewicz</h5>
    </header>
    <div class="container-fluid flex-grow-1 mt-4 mb-5">
        <div class="row">
            <aside class="col-md-3 bg-light p-3">
                <h4 class="text-center">Spis treści</h4>
                <div class="nav flex-column nav-pills" id="toc">
                    <a class="nav-link" href="index.html">
                        Strona główna
                    </a>
                </div>
            </aside>
            <main class="col-md-9" id="content">
            
                
            </main>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">
            <strong>Małgorzata Zgama ANS w Nowym Targu</strong>
        </p>
    </footer>

    <script type="text/javascript">
        for(let i = 1; i < 13; i++){
            let a = document.createElement("a");
            a.href = "./index.html?k=" + i;
            a.className = "nav-link";
            a.innerHTML = "Księga " + i;
            document.getElementById("toc").appendChild(a);
        }
        const current = window.location.href;
        document.querySelectorAll("#toc > a").forEach(function(elem){
            if(elem.href === current){
                elem.classList.add("active");
            }
        });
        const url = new URL(current);
        const i = url.searchParams.get("k");
        console.log(i)
        if(i){
            fetch("./k" + i + ".html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("content").innerHTML = data;
                });
        } 
        else {
        let img = document.createElement('img');
        img.src = "./Tadek.png";
        img.alt = "Pan Tadeusz";
        img.className = "img-fluid mb-4";
        document.getElementById("content").appendChild(img);
        }
        function hide_show() {
            var div = document.getElementById("book_content");
            if (div.style.display === "none") {
                div.style.display = "block";
                document.querySelector(".btn").innerHTML = "Zwiń";
            } else {
                div.style.display = "none";
                document.querySelector(".btn").innerHTML = "Rozwiń";
            }
        }
    </script>

</body>
</html>
